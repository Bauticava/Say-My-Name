<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Say My Name — Juego de Cartas</title>
  <meta name="description" content="App compañera para partidas presenciales de Say My Name. Mazo digital, temporizador y reglas offline." />

  <!-- Configuración PWA y Móvil -->
  <meta name="theme-color" content="#120e24" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Say My Name" />

  <!-- Manifiesto e Íconos -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Contenedor principal de la aplicación -->
  <main id="app" role="main"></main>

  <noscript>
    <div style="padding: 2rem; text-align: center; color: #fff;">
      <h1>Say My Name</h1>
      <p>Esta aplicación requiere JavaScript habilitado para gestionar el mazo y el temporizador.</p>
    </div>
  </noscript>

  <!-- Módulo ES de arranque -->
  <script type="module" src="js/app.js"></script>

</html>
